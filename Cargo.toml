[package]
name = "headroom"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
futures-lite = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = [
    "NSAttributedString",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSValue",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
